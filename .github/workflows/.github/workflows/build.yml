name: build

# Запускается при каждом push и вручную (вкладка Actions -> build -> Run workflow)
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Устанавливает Gradle 8.14 — Gradle Wrapper в проекте не нужен
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14

      - name: Build
        run: gradle build --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: music-subtitles
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
